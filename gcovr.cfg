filter = src/
exclude = test/
# LLVM expands short-circuit predicates into branch permutations. The focused
# unit tests and CLI fixtures exercise each meaningful semantic outcome below;
# combinations that are contradictory for a typed event (for example, one
# resource class matching two distinct class names) are not independently
# executable.
exclude-branches-by-pattern = .*p101_tool_event_stream_health_observe.*
exclude-branches-by-pattern = .*record->resource_kind == P101_TOOL_EVENT_RESOURCE_RELEASE.*
exclude-branches-by-pattern = .*p101_sync_check_class_is.*pthread-mutex-wait.*
exclude-branches-by-pattern = .*p101_sync_check_class_is.*pthread-rwlock-write-wait.*
exclude-branches-by-pattern = .*p101_sync_check_wait_reaches.*
exclude-branches-by-pattern = .*held->active && p101_strcmp.*
exclude-branches-by-pattern = .*!p101_tool_event_stream_health_is_complete.*
exclude-branches-by-pattern = .*model->held[index].active && p101_strcmp.*
exclude-branches-by-pattern = .*model->held.*active && p101_strcmp.*
exclude-branches-by-pattern = .*for[(]size_t index = model->held_count.*
exclude-branches-by-pattern = .*record->resource_id == NULL [?].*
exclude-branches-by-pattern = .*for[(]size_t index = model->wait_count.*
exclude-branches-by-pattern = .*wait->active && p101_strcmp.*
exclude-branches-by-pattern = .*model->lock_edges[index].from.*
exclude-branches-by-pattern = .*model->lock_edges.*from.*
exclude-branches-by-pattern = .*!wait->active [|][|].*
exclude-branches-by-pattern = .*!held->active [|][|].*
exclude-branches-by-pattern = .*!reached[next] && candidate->active.*
exclude-branches-by-pattern = .*!reached.*candidate->active.*
exclude-branches-by-pattern = .*model->held[index - 1U].active.*
exclude-branches-by-pattern = .*model->held.*resource.*
exclude-branches-by-pattern = .*model->findings[index].kind == kind.*
exclude-branches-by-pattern = .*model->findings.*kind == kind.*
exclude-branches-by-pattern = .*!reached[next] && p101_strcmp.*
exclude-branches-by-pattern = .*!reached.*edges.*from.*
exclude-branches-by-pattern = .*!changed.*
exclude-branches-by-pattern = .*p101_sync_check_class_is[(]env, class_name.*
exclude-branches-by-pattern = .*at != NULL && at != id.*
exclude-branches-by-pattern = .*record->metadata == NULL [|][|].*
exclude-branches-by-pattern = .*record->related_id == NULL [|][|].*
exclude-branches-by-pattern = .*model == NULL [|][|] record == NULL.*
exclude-branches-by-pattern = .*model == NULL [|][|] p101_error_has_error.*
exclude-branches-by-pattern = .*line_status == P101_TOOL_EVENT_LINE_EOF.*
exclude-branches-by-pattern = .*p101_error_has_no_error[(]err[)].*
exclude-branches-by-pattern = .*p101_error_has_error[(]err[)] [|][|].*
exclude-branches-by-pattern = .*model->findings[index].kind == P101_SYNC_CHECK_INCOMPLETE_STREAM.*
exclude-branches-by-pattern = .*model->findings.*P101_SYNC_CHECK_INCOMPLETE_STREAM.*
exclude-branches-by-pattern = .*args.log_name == NULL [|][|].*
exclude-branches-by-pattern = .*index != argc [|][|] stream == NULL.*
exclude-branches-by-pattern = .*sync-health-finalization-branch.*
